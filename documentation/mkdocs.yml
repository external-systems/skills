site_name: external-systems skills

# Live preview port (devenv `docs` script / `devenv up`); 8000 is left
# to the apps themselves.
dev_addr: 127.0.0.1:8981

# Page links as page.html instead of page/, so the static build browses
# straight from disk: firefox result-docs/index.html
use_directory_urls: false

nav:
  - Home: index.md
  - Shipping skills: shipping.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  # Makes search (and the rest of the site) work from file://.
  - offline

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
